name: Release

# Push a tag like v0.2.0 to build, test, sign, notarize and publish a GitHub release with the DMG and the zipped app.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # the full history: the build number is the commit count

      - name: Test
        run: swift test

      - name: Signing keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: scripts/ci-signing-keychain.sh setup

      - name: Release build, Developer ID signed
        env:
          TAG: ${{ github.ref_name }}
        run: VERSION="${TAG#v}" scripts/build-app.sh

      - name: Notarize and staple the app and the DMG
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/notarize.sh

      - name: Remove the signing keychain
        if: always()
        run: scripts/ci-signing-keychain.sh cleanup

      - name: Checksums
        working-directory: dist
        run: shasum -a 256 AgentHuddle.zip AgentHuddle.dmg > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/AgentHuddle.dmg dist/AgentHuddle.zip dist/SHA256SUMS \
            --title "Agent Huddle $TAG" --generate-notes --verify-tag

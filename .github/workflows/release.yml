name: Release

# Push a tag like v0.2.0 to build, test and publish a GitHub release with the zipped app.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # the full history: the build number is the commit count

      - name: Test
        run: swift test

      - name: Release build and package
        env:
          TAG: ${{ github.ref_name }}
        run: VERSION="${TAG#v}" scripts/build-app.sh

      - name: Checksum
        working-directory: dist
        run: shasum -a 256 AgentHuddle.zip > AgentHuddle.zip.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/AgentHuddle.zip dist/AgentHuddle.zip.sha256 \
            --title "Agent Huddle $TAG" --generate-notes --verify-tag
